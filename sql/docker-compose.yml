services:
  db:
    image: postgres:16
    container_name: la_remise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laremise
      POSTGRES_PASSWORD: laremise
      POSTGRES_DB: la_remise
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Ces scripts ne s'exécutent automatiquement que si le volume est vide
      # (première initialisation du conteneur).
      - ./migration_up.sql:/docker-entrypoint-initdb.d/01_migration_up.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    
volumes:
  db_data: